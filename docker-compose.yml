version: "3.8"

services:
  contextio-next:
    image: ghcr.io/rpowell01/contextio-next:latest
    ports:
      - "4040:4040"
    volumes:
      # Captures directory - writable by node user (UID 1000)
      - captures:/app/captures
      # Policy directory - writable by node user
      - policy:/app/custom-policy
      # Settings directory - persists settings.json across restarts
      - settings:/home/node/.contextio-next
    environment:
      # Core configuration
      NODE_ENV: production
      CONTEXT_PROXY_BIND_HOST: 0.0.0.0
      CONTEXT_PROXY_PORT: 4040
      # Memory optimization: limit V8 heap to 1.5GB to prevent OOM and force earlier GC
      # --expose-gc enables manual GC triggering from application code
      NODE_OPTIONS: "--max-old-space-size=1536 --expose-gc"

      # Plugin enable/disable (all enabled by default)
      CONTEXTIO_ENABLE_LOGGER: "true"
      CONTEXTIO_ENABLE_REDACT: "true"
      CONTEXTIO_ENABLE_RATE_LIMITER: "true"

      # Logging configuration
      LOG_TRAFFIC: "false"
      DEBUG_ROUTING: "false"
      LOGGER_CAPTURE_DIR: /app/captures
      LOGGER_MAX_SESSIONS: "0"

      # Redaction configuration
      REDACT_POLICY_FILE: /app/custom-policy/custom-policy.json
      REDACT_REVERSIBLE: "false"
      REDACT_PRESET: pii
      REDACT_CAPTURE_DIR: /app/captures

      # Rate limiter configuration (used by built-in plugin)
      CONTEXTIO_RATE_LIMIT_OPENAI_MAX_REQUESTS: "60"
      CONTEXTIO_RATE_LIMIT_OPENAI_WINDOW_MS: "60000"
      CONTEXTIO_RATE_LIMIT_OPENAI_BUFFER: "10"
      # Rate limiter memory limits
      CONTEXTIO_RATE_LIMIT_MAX_ENTRIES: "2000"
      CONTEXTIO_RATE_LIMIT_CLEANUP_INTERVAL_MS: "60000"
      CONTEXTIO_RATE_LIMIT_ENTRY_TTL_MS: "300000"

      # Retry plugin memory limits
      CONTEXTIO_RETRY_MAX_ENTRIES: "1000"
      CONTEXTIO_RETRY_ENTRY_TTL_MS: "300000"
      CONTEXTIO_RETRY_CLEANUP_INTERVAL_MS: "30000"
      CONTEXTIO_RETRY_MAX_BUFFER_SIZE: "5242880"
      CONTEXTIO_RETRY_MAX_STREAM_RETRIES: "3"

      # Redact plugin session TTL (15 min instead of 30 min default)
      REDACT_SESSION_TTL_MS: "900000"

      # Next.js cache directory for ISR
      NEXT_CACHE_DIR: /app/captures/.next/cache

      # Database path
      CONTEXTIO_DB_PATH: /app/custom-policy/contextio.db

      # Web UI configuration
      NEXT_PUBLIC_SITE_URL: http://localhost:4040

      # Required secrets (set via .env file or Docker secrets)
      # CSRF_SECRET: ${CSRF_SECRET}
      # CONTEXTIO_LOGGER_ENCRYPTION_KEY: ${CONTEXTIO_LOGGER_ENCRYPTION_KEY}
      # Use baked-in default providers.json instead of volume mount
      PROVIDERS_FILE: /app/default-providers.json

      # OIDC configuration (optional)
      # CONTEXTIO_OIDC_ENABLED: "false"
      # CONTEXTIO_OIDC_ISSUER: ""
      # CONTEXTIO_OIDC_CLIENT_ID: ""
      # CONTEXTIO_OIDC_CLIENT_SECRET: ""
      # CONTEXTIO_OIDC_SESSION_SECRET: ""
      # CONTEXTIO_OIDC_PUBLIC_URL: ""
      # CONTEXTIO_OIDC_SCOPE: "openid profile email"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4040"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  captures:
    driver: local
  policy:
    driver: local
  settings:
    driver: local